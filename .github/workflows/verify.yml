name: Verify code and final PDFs
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m unittest discover -s tests -v
      - run: python src/check_repository.py
      - run: python src/build_deliverables.py
      - run: python src/validate_deliverables.py
      # Aggregates-only PDF build: no private data or claimed raw-data replay.
